    "ipykernel>=7.2.0",
    "numpy>=2.4.1",
    "pandas-stubs~=3.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "scipy-stubs~=1.17.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torch",
    "yfinance>=1.1.0",
]
